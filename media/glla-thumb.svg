<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GLLA — verified goal loop</title>
  <desc id="desc">A mint green goal loop surrounds a white verification check. An amber node marks work in progress on a deep navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182b3f"/><stop offset="1" stop-color="#08121f"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#85f4c2"/><stop offset="1" stop-color="#20cdb6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="208" fill="url(#tile)"/>
  <rect x="24" y="24" width="976" height="976" rx="184" fill="none" stroke="#284155" stroke-width="4"/>
  <circle cx="512" cy="512" r="240" fill="#0c1b29"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="#243e4d" stroke-width="76"/>
  <path d="M512 192 A320 320 0 1 1 235 352" fill="none" stroke="url(#loop)" stroke-width="76" stroke-linecap="round"/>
  <circle cx="235" cy="352" r="43" fill="#ffbd69" stroke="#112333" stroke-width="14"/>
  <path d="M366 514 L466 614 L660 412" fill="none" stroke="#f2fff9" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
